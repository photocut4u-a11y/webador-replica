<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Webador</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230066cc'/%3E%3Crect x='36' y='44' width='28' height='40' rx='6' fill='%23fff'/%3E%3Ccircle cx='50' cy='62' r='10' fill='%230066cc'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #0066cc;
    --accent-hover: #0052a3;
    --border: #d9d9d9;
    --error: #d64545;
    --card: #f7f7f7;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    background: var(--bg);
    max-width: 420px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    padding: 32px;
  }

  .card-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .card-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 4px;
  }

  .card-header p {
    color: var(--muted);
    font-size: 14px;
  }

  .field-group { margin-bottom: 16px; }

  .field-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 6px;
  }

  .field-group input[type="email"],
  .field-group input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s;
    background: var(--bg);
  }

  .field-group input:focus {
    border-color: var(--accent);
  }

  .form-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
  }

  .btn {
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-google,
  .btn-facebook {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-google:hover { background: #f1f3f4; }
  .btn-facebook:hover { background: #e9f2fc; }

  .social-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    margin: 16px 0;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .forgot {
    text-align: right;
    font-size: 13px;
  }

  .forgot a {
    color: var(--accent);
    text-decoration: none;
  }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--muted);
  }

  .footer a { color: var(--accent); text-decoration: none; }

  .cookie-section {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .cookie-col {
    display: flex;
    gap: 12px;
  }

  .cookie-col button {
    flex: 1;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
  }

  .cookie-col .agree-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cookie-col .agree-btn:hover { background: var(--accent-hover); }

  @media (max-width: 480px) {
    .card { padding: 24px 20px; }
    .card-header h1 { font-size: 20px; }
  }
  .form-message {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    background: #eef4ff;
    color: var(--accent);
  }
  .form-message--error {
    background: #fdeeee;
    color: var(--error);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>Log in</h1>
      <p>Enter your credentials to access your account</p>
    </div>

    <form id="loginForm">
      <div class="form-actions">
        <div class="field-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required />
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
        </div>
        <div class="field-group" style="margin-bottom:0;">
          <div class="forgot">
            <a href="/v2/account/password-recovery">Forgot password?</a>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </div>
    </form>
    <div id="message" class="form-message" hidden></div>

    <div class="social-row">
      <button class="btn btn-facebook" type="button">
        <img src="https://assets.jwwb.nl/assets/img/sso/facebook.svg" alt="Facebook" style="width:18px;height:18px;" />
        Log in with Facebook
      </button>
      <button class="btn btn-google" type="button">
        <img src="https://assets.jwwb.nl/assets/img/sso/google.svg" alt="Google" style="width:18px;height:18px;" />
        Log in with Google
      </button>
    </div>

    <div class="divider">or continue with</div>

    <div class="cookie-section">
      <p>
        In using our service, you agree to the
        <a href="/terms-and-conditions">terms and conditions</a> and
        <a href="/privacy">privacy</a>.
      </p>
      <div class="cookie-col">
        <button class="agree-btn" type="button">Agree</button>
        <button type="button">Decline</button>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const msg = document.getElementById('message');
      const btn = form.querySelector('.btn-primary');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!email.value || !password.value) return;
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        msg.textContent = 'Signing in…';
        msg.hidden = false;
        setTimeout(() => {
          msg.textContent = 'Signed in as ' + email.value + '.';
          msg.className = 'form-message';
          btn.disabled = false;
          btn.textContent = 'Log in';
        }, 700);
      });
    })();
  </script>
</body>
</html>
